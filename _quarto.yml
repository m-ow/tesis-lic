project:
  type: book

book:
  title: 'Una prueba transicional de la confluencia de la reducción $\eta$'
  author:
    - name: "Maximiliano Onofre Martínez"
  chapters:
    - index.qmd
    - Capitulo1.qmd
    - Capitulo2.qmd
    - Capitulo3.qmd
lang: es
format:
  pdf:
    pdf-engine: xelatex
    documentclass: scrreprt
    toc-depth: 2
    number-depth: 0
    syntax-definitions: [lean.xml,state.xml]
    include-in-header: inpreamble.tex
    include-before-body: thmdefs.tex
    monofont: JuliaMono
    keep-tex: true

filters:
  - latex-environment
environments: [quote, ind, inpt, outpt, bef, aft, numex, mdsk, thm, nthm, dfn, ndfn, npf, absnobreak]
commands: [excl, lrg]
